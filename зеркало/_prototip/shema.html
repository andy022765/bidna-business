<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Схема</title><style>body{margin:0;background:#e9e6e0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#161c33}.w{max-width:760px;margin:0 auto;padding:22px 18px 30px}h1{font-size:20px;margin:0 0 4px}p.c{color:#7b8194;font-size:13.5px;margin:0 0 14px}.card{background:#fbfaf7;border:1px solid #d4cec1;border-radius:8px;padding:18px 16px}.flow{width:100%;height:auto;display:block}</style></head><body><div class="w"><h1>Путь вашего клиента и кто его ведёт</h1><p class="c">Отзывы возвращаются в тексты — машина кормит саму себя.</p><div class="card"><svg class="flow" viewBox="0 0 700 636" role="img" aria-label="Путь клиента и кто его ведёт">

<path class="a" d="M519,74 L519,92 Q519,104 507,104 L376,104" marker-end="url(#ar)"/>

<line x1="344" y1="254" x2="344" y2="284" marker-end="url(#ar)"/>
<text class="l" x="356" y="274">замолчал?</text>

<rect class="y" x="154" y="390" width="380" height="64" rx="10"/>

<rect class="m" x="154" y="490" width="380" height="64" rx="10"/>
